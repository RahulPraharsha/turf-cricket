<style>
  :root{
    --bg:#081028;

    --card:#162149;
    --card2:#1f2d5e;
    --accent:#7c5cff;
    --accent2:#22d3ee;
    --warn:#fbbf24;
    --danger:#ef4444;
    --info:#38bdf8;
    --text:#f1f5ff;

    --radius:18px;

  }
  /* interactive polish */
  .btn,.item,.stat,.chip,.card{transition:transform .15s ease, box-shadow .15s ease, filter .15s ease}
  .btn:active{transform:scale(.95)}
  .item:active,.stat:active{transform:scale(.98)}
  .card:hover{box-shadow:0 12px 32px rgba(124,92,255,.25)}
  .navbtn{transition:transform .15s ease;transform:scale(1)}
  .navbtn:active{transform:scale(.9)}

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{

  ];
  seed.drinks = [
    {id:"d1",date:today,item:"Water Bottle",qty:12,price:20,total:240,createdBy:"u1",createdByName:"Srinivasa Rao",createdByUsername:"srinivasa",createdAt:Date.now()-90000},

function saveData(d){ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function getSession(){ try{return JSON.parse(localStorage.getItem(SESSION_KEY));}catch(e){return null;} }

function isAdmin(){ return CURRENT_USER && CURRENT_USER.role==="admin"; }

  const u = (DATA.users||[]).find(x=>x.id===id);
  if(u) return u.name || u.username || fallback || id || "Unknown";

// ---------- Utilities ----------
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>[...root.querySelectorAll(sel)];

function fmtDate(iso){ if(!iso)return""; const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString(undefined,{weekday:"short",day:"2-digit",month:"short",year:"numeric"}); }
function fmtMoney(n){ return "₹"+Number(n||0).toLocaleString("en-IN"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function allDates(){ const s=new Set(); DATA.bookings.forEach(b=>s.add(b.date)); DATA.drinks.forEach(d=>s.add(d.date)); s.add(todayISO()); return [...s].sort().reverse(); }

// ---------- Toast ----------
function toast(msg,kind="info"){
  let t=document.createElement("div");
  t.textContent=msg;
  t.style.cssText=`position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:${kind==="err"?"#e74c3c":kind==="ok"?"#2ecc71":"#34495e"};color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;z-index:100;box-shadow:0 8px 20px rgba(0,0,0,.4);opacity:0;transition:.2s`;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.style.opacity="1");
  setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),200);},2200);
}

// ---------- Time slot parsing / overlap ----------
function toMinutesTime(h,m,ampm){
  let hour=parseInt(h,10); if(isNaN(hour)) return null;
  let min=m?parseInt(m,10):0; if(isNaN(min)) return null;
  if(ampm){
    ampm=ampm.toLowerCase();
    if(ampm==="pm" && hour<12) hour+=12;
    if(ampm==="am" && hour===12) hour=0;
  }
  if(hour<0||hour>23||min<0||min>59) return null;
  return hour*60+min;
}
function parseTimeSlot(str){
  if(!str) return null;
  const s=str.trim().replace(/\s+/g," ");
  // normalize separators: "to" between times
  const m=s.match(/^(.+?)\s*(?:-|–|—|to)\s*(.+)$/i);
  if(!m) return null;
  // extract time tokens
  const parseToken=(tok)=>{
    const mm=tok.trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);
    if(!mm) return null;
    return toMinutesTime(mm[1],mm[2],mm[3]);
  };
  const a=parseToken(m[1]), b=parseToken(m[2]);
  if(a==null || b==null) return null;
  let end=b;
  if(end<=a) end+=1440; // overnight
  if(end<=a) return null;
  return {start:a,end:end};
}
function slotsOverlap(a,b){
  if(!a||!b) return false;
  return a.start < b.end && b.start < a.end;
}

// ---------- Auto-complete bookings by time ----------
function slotEndTimestamp(b){
  if(!b || !b.date) return null;
  const base=new Date(b.date+"T00:00:00").getTime();
  const slot=parseTimeSlot(b.time);
  if(!slot) return null;
  return base + slot.end*60000;
}
function autoCompleteBookings(){
  let changed=false;
  const now=Date.now();
  (DATA.bookings||[]).forEach(b=>{
    if(b.status==="booked"){
      const end=slotEndTimestamp(b);
      if(end!==null && end<=now){ b.status="completed"; changed=true; }
    }
  });
  if(changed) saveData(DATA);
}

  $("#logoutBtn").onclick=()=>{ clearSession(); CURRENT_USER=null; currentView="home"; render(); };
  const cpw=$("#changePwBtn"); if(cpw) cpw.onclick=openChangePasswordForm;
  $$(".navbtn").forEach(b=>b.onclick=()=>showView(b.dataset.view));

function openPaymentForm(bookingId){
  const b=DATA.bookings.find(x=>x.id===bookingId);
  if(!b){ toast("Booking not found","err"); return; }
  const amount=Number(b.amount)||0;
  const paid=Number(b.paid)||0;
  const balance=amount-paid;
  if(balance<=0){ toast("No balance pending","info"); return; }
  openModal(`
    <button class="close" onclick="closeModal()">×</button>
    <h2>Record Payment • ${esc(b.customer)}</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px">Total ${esc(fmtMoney(amount))} • Paid ${esc(fmtMoney(paid))} • <b>Balance ${esc(fmtMoney(balance))}</b></p>
    <div class="field"><label>Payment amount (₹) *</label><input type="number" id="pf_amt" value="${balance}" placeholder="0" min="1"/></div>
    <div class="field"><label>Payment type</label><select id="pf_type"><option value="advance">Advance</option><option value="balance">Balance</option><option value="full">Full/Other</option></select></div>
    <div class="field"><label>Method (offline only)</label><select id="pf_method"><option value="Cash">Cash</option><option value="Bank Transfer">Bank Transfer</option><option value="Other">Other</option></select></div>
    <div class="field"><label>Reference / receipt (optional)</label><input id="pf_ref" placeholder="receipt id / note"/></div>
    <div class="row">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="pf_save">Record Payment</button>
    </div>
  `);
  $("#pf_save").onclick=()=>{
    const amt=Number($("#pf_amt").value)||0;
    const type=$("#pf_type").value;
    const method=$("#pf_method").value;
    const ref=$("#pf_ref").value.trim();
    if(amt<=0){ toast("Payment amount must be greater than 0","err"); return; }
    if(amt>balance){ toast("Payment cannot exceed balance due ("+fmtMoney(balance)+")","err"); return; }
    b.paid=(Number(b.paid)||0)+amt;
    if(!Array.isArray(b.payments)) b.payments=[];
    b.payments.push({id:uid("p"),date:todayISO(),amount:amt,method,type,note:ref,createdBy:CURRENT_USER.id,createdByName:CURRENT_USER.name});
    saveData(DATA);
    toast("Payment recorded","ok");
    closeModal();
    renderContent();
  };
}
function openBookingForm(editId=null){
  const b = editId ? DATA.bookings.find(x=>x.id===editId) : null;
  openModal(`
    <button class="close" onclick="closeModal()">×</button>
    <h2>${b?"Edit Booking":"New Booking"}</h2>
    <div class="field"><label>Date</label><input type="date" id="bf_date" value="${b?b.date:todayISO()}"/></div>
    <div class="field"><label>Time slot</label><input id="bf_time" value="${b?esc(b.time):""}" placeholder="e.g. 18:00-19:00"/></div>
    <div class="field"><label>Customer name</label><input id="bf_cust" value="${b?esc(b.customer):""}" placeholder="Name / team"/></div>
    <div class="field"><label>Contact (mandatory, 10 digits)</label><input id="bf_contact" value="${b?esc(b.contact):""}" placeholder="Mobile number" required/></div>
    <div class="field"><label>Turf</label><select id="bf_turf">${TURFS.map(t=>`<option ${b&&b.turf===t?"selected":""}>${t}</option>`).join("")}</select></div>
    <div class="field"><label>Amount (₹) (mandatory)</label><input type="number" id="bf_amt" value="${b?b.amount:""}" placeholder="Total amount" min="1" required/></div>
    ${!b?`<div class="field"><label>Advance paid now (₹) (optional)</label><input type="number" id="bf_advance" value="0" placeholder="0" min="0"/></div>`:""}
    ${b && isAdmin()?`<div class="field"><label>Paid so far (₹) (admin)</label><input type="number" id="bf_paid" value="${Number(b.paid)||0}" placeholder="0" min="0"/></div>`:""}
    <div class="field"><label>Status</label><select id="bf_status">${["booked","completed","cancelled"].map(s=>`<option value="${s}" ${b&&b.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
    <div class="row">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="bf_save">Save</button>
    </div>
  `);
  $("#bf_save").onclick=()=>{
    const rec={
      date:$("#bf_date").value,
      time:$("#bf_time").value.trim(),
      customer:$("#bf_cust").value.trim(),
      contact:$("#bf_contact").value.trim(),
      turf:$("#bf_turf").value,
      amount:Number($("#bf_amt").value)||0,
      status:$("#bf_status").value,
    };
    if(!rec.date||!rec.customer){ toast("Date and customer are required","err"); return; }
    if(!rec.contact || !/^\d{10,}$/.test(rec.contact)){ toast("Valid 10-digit mobile number is required","err"); return; }
    if(!rec.amount || rec.amount<=0){ toast("Booking amount is required","err"); return; }
    if(!rec.time) rec.time="—";
    const newSlot=parseTimeSlot(rec.time);
    if(newSlot){
      const conflict=DATA.bookings.find(x=>{
        if(b && x.id===b.id) return false;
        if(x.date!==rec.date) return false;
        if(x.turf!==rec.turf) return false;
        return slotsOverlap(newSlot, parseTimeSlot(x.time));
      });
      if(conflict){ toast("Slot overlaps with existing booking ("+conflict.time+") on "+rec.turf,"err"); return; }
    }
    if(b){
      if(!isAdmin()){ toast("Only admin can edit","err"); return; }
      const oldPaid=Number(b.paid)||0;
      Object.assign(b,rec); b.updatedAt=Date.now();
      if(isAdmin() && $("#bf_paid")){
        const newPaid=Number($("#bf_paid").value);
        if(!isNaN(newPaid)) b.paid=Math.min(newPaid, rec.amount);
      } else {
        if(b.paid>rec.amount) b.paid=rec.amount;
      }
      if(b.paid<0) b.paid=0;
      toast("Booking updated","ok");
    } else {
      const advance=Number($("#bf_advance").value)||0;
      if(advance<0 || advance>rec.amount){ toast("Advance must be between 0 and total amount","err"); return; }
      const payments = advance>0 ? [{id:uid("p"),date:todayISO(),amount:advance,method:"Advance",type:"advance",note:"Advance paid at booking",createdBy:CURRENT_USER.id,createdByName:CURRENT_USER.name}] : [];
      DATA.bookings.push({id:uid("b"),...rec,createdBy:CURRENT_USER.id,createdByName:CURRENT_USER.name,createdByUsername:CURRENT_USER.username,paid:advance,payments,createdAt:Date.now()});
      toast("Booking added","ok");
    }
    saveData(DATA);
    closeModal();
    renderContent();
  };
}
function deleteBooking(id){
  if(!isAdmin()){ toast("Only admin can delete","err"); return; }
  if(!confirm("Delete this booking?")) return;
  DATA.bookings=DATA.bookings.filter(b=>b.id!==id);
  saveData(DATA);
  toast("Booking deleted","ok");
  renderContent();
}

  };
  $$("[data-reset-pw]").forEach(b=>b.onclick=()=>resetPw(b.dataset.resetPw));
  $$("[data-del-user]").forEach(b=>b.onclick=()=>deleteUser(b.dataset.delUser));
}
function openUserForm(){
  openModal(`
    <button class="close" onclick="closeModal()">×</button>
    <h2>New Account</h2>
    <div class="field"><label>Name</label><input id="uf_name" placeholder="Full name"/></div>
    <div class="field"><label>Username</label><input id="uf_user" placeholder="username"/></div>
    <div class="field"><label>Password</label><input id="uf_pw" placeholder="password"/></div>
    <div class="field"><label>Role</label><select id="uf_role"><option value="user">user</option><option value="admin">admin</option></select></div>
    <div class="row">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="uf_save">Create</button>
    </div>
  `);
  $("#uf_save").onclick=()=>{
    const name=$("#uf_name").value.trim();
    const username=$("#uf_user").value.trim().toLowerCase();
    const pw=$("#uf_pw").value;
    const role=$("#uf_role").value;
    if(!name||!username||!pw){ toast("All fields required","err"); return; }
    if(DATA.users.some(u=>u.username.toLowerCase()===username)){ toast("Username taken","err"); return; }
    if(passwordInUse(pw)){ toast("That password is already used by another account","err"); return; }
    DATA.users.push({id:uid("u"),username,password:pw,name,role});
    saveData(DATA);
    toast("Account created","ok");
    closeModal(); renderContent();
  };
}
function resetPw(id){
  const u=DATA.users.find(x=>x.id===id);
  const np=prompt("New password for "+u.username+":");
  if(!np) return;
  if(passwordInUse(np,u.id)){ toast("That password is already used by another account","err"); return; }
  u.password=np; saveData(DATA); toast("Password updated","ok");
}
function deleteUser(id){
  if(!confirm("Delete this account? Their records stay.")) return;
  DATA.users=DATA.users.filter(u=>u.id!==id);
  saveData(DATA); renderContent(); toast("Account deleted","ok");
}
function exportData(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="cricket-turf-backup.json"; a.click();
  URL.revokeObjectURL(url);
  toast("Export downloaded","ok");
}

function openChangePasswordForm(){
  const u=DATA.users.find(x=>x.id===CURRENT_USER.id);
  openModal(`
    <button class="close" onclick="closeModal()">×</button>
    <h2>Change Password</h2>
    <div class="field"><label>Current password</label><input type="password" id="cp_cur" placeholder="current password"/></div>
    <div class="field"><label>New password</label><input type="password" id="cp_new" placeholder="new password"/></div>
    <div class="field"><label>Confirm new password</label><input type="password" id="cp_conf" placeholder="confirm"/></div>
    <p class="notice">Passwords must be unique across accounts.</p>
    <div class="row">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="cp_save">Update</button>
    </div>
  `);
  $("#cp_save").onclick=()=>{
    const cur=$("#cp_cur").value;
    const nw=$("#cp_new").value;
    const conf=$("#cp_conf").value;
    if(cur!==u.password){ toast("Current password incorrect","err"); return; }
    if(!nw){ toast("New password required","err"); return; }
    if(nw!==conf){ toast("Passwords do not match","err"); return; }
    if(nw===cur){ toast("New password must differ","err"); return; }
    if(passwordInUse(nw,u.id)){ toast("That password is already used by another account","err"); return; }
    u.password=nw; saveData(DATA); CURRENT_USER=u; toast("Password updated","ok"); closeModal();
  };
}
// ---------- Boot ----------
function boot(){
  if(currentView==="manage" && !isAdmin()) currentView="home";
  render();
}
boot();
